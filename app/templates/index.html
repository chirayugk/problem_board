<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">

<head>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "woucd6994d");
</script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Problem Board</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Anonymous Problem Board</h1>

        <button
            class="btn btn-primary"
            onclick="toggleTheme()"
        >
            Toggle Theme
        </button>

    </div>

    <div class="card p-4 mb-5">

        <form action="/add-problem" method="post">

            <input
                type="text"
                name="title"
                class="form-control mb-3"
                placeholder="Problem title"
                required
            >

            <textarea
                name="description"
                class="form-control mb-3"
                rows="5"
                placeholder="Describe your problem..."
                required
            ></textarea>

            <input
                type="text"
                name="tag"
                class="form-control mb-3"
                placeholder="Tag (example: coding)"
                required
            >

            <button
                type="submit"
                class="btn btn-success"
            >
                Post Problem
            </button>

        </form>

    </div>

    {% for problem in problems %}

    <div class="card p-4 mb-4">

        <a
            href="/problem/{{ problem.id }}"
            class="text-decoration-none"
        >

            <h3>{{ problem.title }}</h3>

        </a>

        <p class="mt-3">

            {{ problem.description }}

        </p>

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>

                <span class="badge bg-primary">

                    {{ problem.tag }}

                </span>

                <span class="badge bg-secondary ms-2">

                    💬 {{ problem.replies|length }} replies

                </span>

            </div>

            <small class="text-muted">

                {{ problem.created_at }}

            </small>

        </div>

        <form
            action="/upvote/{{ problem.id }}"
            method="post"
            style="display: inline;"
        >

            <button
                class="btn btn-outline-primary btn-sm"
            >

                ▲ {{ problem.upvotes }} Upvotes

            </button>

        </form>

        <a
            href="/problem/{{ problem.id }}"
            class="btn btn-info btn-sm ms-2"
        >

            View Details

        </a>

    </div>

    {% endfor %}

</div>

<script>

function toggleTheme() {

    const html =
        document.documentElement;

    const current =
        html.getAttribute("data-bs-theme");

    if (current === "dark") {

        html.setAttribute(
            "data-bs-theme",
            "light"
        );

    } else {

        html.setAttribute(
            "data-bs-theme",
            "dark"
        );
    }
}

</script>

</body>
</html>
